<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Oh My Group lifecycle</title>
  <desc id="desc">Three coordination modes: Observe, Work Lite, and Full.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#081321"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset=".58" stop-color="#60a5fa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#314158" opacity=".32"/></pattern>
  </defs>
  <rect width="1600" height="840" rx="28" fill="url(#bg)"/><rect width="1600" height="840" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1598" height="838" rx="27" fill="none" stroke="#1e293b" stroke-width="2"/>

  <g transform="translate(70 62)">
    <rect width="110" height="110" rx="26" fill="#0b1725" stroke="#334155" stroke-width="2"/>
    <path d="M28 31h-12v48h12M82 31h12v48H82" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="27" width="38" height="57" rx="11" fill="#071421" stroke="#5eead4" stroke-width="4"/><path d="M46 45l10 9-10 9M59 64h9" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="52" fill="url(#brand)" font-family="Inter,system-ui,sans-serif" font-size="58" font-weight="850">Oh My Group</text>
    <text x="145" y="91" fill="#cbd5e1" font-family="Inter,system-ui,sans-serif" font-size="26"><tspan fill="#5eead4" font-weight="750">OMG CLI</tspan> lifecycle</text>
  </g>

  <text x="80" y="242" fill="#e2e8f0" font-family="Inter,system-ui,sans-serif" font-size="54" font-weight="820">Use the lightest safe mode for the job.</text>
  <text x="80" y="284" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">Rigor increases only when mutation, shared ownership, release, or protected operations require it.</text>

  <g transform="translate(68 350)">
    <g>
      <rect width="430" height="360" rx="30" fill="#071a1d" stroke="#2b645f" stroke-width="2"/>
      <circle cx="80" cy="78" r="48" fill="#0c2a27" stroke="#5eead4" stroke-width="3"/>
      <path d="M44 78c20-31 52-31 72 0-20 31-52 31-72 0z" fill="none" stroke="#5eead4" stroke-width="5"/><circle cx="80" cy="78" r="13" fill="#5eead4"/>
      <text x="150" y="69" fill="#5eead4" font-family="Inter,system-ui,sans-serif" font-size="39" font-weight="850">OBSERVE</text>
      <text x="150" y="105" fill="#cbd5e1" font-family="Inter,system-ui,sans-serif" font-size="22">Read-only inspection</text>
      <line x1="42" y1="148" x2="388" y2="148" stroke="#2b645f"/>
      <g fill="#e2e8f0" font-family="Inter,system-ui,sans-serif" font-size="24">
        <circle cx="58" cy="196" r="7" fill="#5eead4"/><text x="86" y="205">no repository mutation</text>
        <circle cx="58" cy="248" r="7" fill="#5eead4"/><text x="86" y="257">no coordination records</text>
        <circle cx="58" cy="300" r="7" fill="#5eead4"/><text x="86" y="309">answer, inspect, diagnose</text>
      </g>
    </g>

    <g transform="translate(520)">
      <rect width="430" height="360" rx="30" fill="#081522" stroke="#315274" stroke-width="2"/>
      <circle cx="80" cy="78" r="48" fill="#0d2238" stroke="#60a5fa" stroke-width="3"/>
      <circle cx="80" cy="64" r="15" fill="none" stroke="#60a5fa" stroke-width="5"/><path d="M51 110c6-22 17-31 29-31s23 9 29 31" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
      <text x="150" y="69" fill="#60a5fa" font-family="Inter,system-ui,sans-serif" font-size="39" font-weight="850">WORK_LITE</text>
      <text x="150" y="105" fill="#cbd5e1" font-family="Inter,system-ui,sans-serif" font-size="22">Single-owner workflow</text>
      <line x1="42" y1="148" x2="388" y2="148" stroke="#315274"/>
      <g fill="#e2e8f0" font-family="Inter,system-ui,sans-serif" font-size="23">
        <circle cx="58" cy="190" r="7" fill="#60a5fa"/><text x="86" y="199">session-scoped preflight</text>
        <circle cx="58" cy="234" r="7" fill="#60a5fa"/><text x="86" y="243">session · task · run</text>
        <circle cx="58" cy="278" r="7" fill="#60a5fa"/><text x="86" y="287">reserve changed paths</text>
        <circle cx="58" cy="322" r="7" fill="#60a5fa"/><text x="86" y="331">finish-lite and archive</text>
      </g>
    </g>

    <g transform="translate(1040)">
      <rect width="430" height="360" rx="30" fill="#111426" stroke="#5b4680" stroke-width="2"/>
      <circle cx="80" cy="78" r="48" fill="#211634" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="64" cy="65" r="11" fill="none" stroke="#a78bfa" stroke-width="4"/><circle cx="96" cy="65" r="11" fill="none" stroke="#a78bfa" stroke-width="4"/><circle cx="80" cy="51" r="11" fill="none" stroke="#c4b5fd" stroke-width="4"/><path d="M42 108c4-17 13-25 25-25M138 108c-4-17-13-25-25-25M57 110c5-21 13-31 23-31s18 10 23 31" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <text x="150" y="69" fill="#a78bfa" font-family="Inter,system-ui,sans-serif" font-size="39" font-weight="850">FULL</text>
      <text x="150" y="105" fill="#cbd5e1" font-family="Inter,system-ui,sans-serif" font-size="22">Multi-agent / release rigor</text>
      <line x1="42" y1="148" x2="388" y2="148" stroke="#5b4680"/>
      <g fill="#e2e8f0" font-family="Inter,system-ui,sans-serif" font-size="23">
        <circle cx="58" cy="190" r="7" fill="#a78bfa"/><text x="86" y="199">messages + dependencies</text>
        <circle cx="58" cy="234" r="7" fill="#a78bfa"/><text x="86" y="243">handoff + review</text>
        <circle cx="58" cy="278" r="7" fill="#a78bfa"/><text x="86" y="287">protected approvals</text>
        <circle cx="58" cy="322" r="7" fill="#a78bfa"/><text x="86" y="331">integration evidence</text>
      </g>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="475" cy="180" r="34" fill="#071421" stroke="#5eead4" stroke-width="3"/><path d="M460 180h28m-10-10l10 10-10 10" stroke="#5eead4" stroke-width="5"/>
      <circle cx="995" cy="180" r="34" fill="#071421" stroke="#818cf8" stroke-width="3"/><path d="M980 180h28m-10-10l10 10-10 10" stroke="#818cf8" stroke-width="5"/>
      <path d="M430 180h11M509 180h11M950 180h11M1029 180h11" stroke="#607a94" stroke-width="3" stroke-dasharray="4 7"/>
    </g>
  </g>

  <rect x="258" y="754" width="1084" height="58" rx="22" fill="#0a1724" stroke="#26364b"/>
  <path d="M303 770l22 9v17c0 15-10 25-22 31-12-6-22-16-22-31v-17z" fill="none" stroke="#5eead4" stroke-width="4" transform="translate(0 -8)"/><path d="M292 785l8 8 14-17" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350" y="791" fill="#dbe4f0" font-family="Inter,system-ui,sans-serif" font-size="24">Escalate rigor only when risk demands it. <tspan fill="#5eead4" font-weight="800">Never turn coordination into ceremony.</tspan></text>
</svg>
