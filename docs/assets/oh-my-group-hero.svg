    <rect x="432" y="36" width="180" height="66" rx="18" fill="url(#mint)"/>
    <text x="522" y="77" text-anchor="middle" fill="#03111b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">Approve &amp; continue</text>
