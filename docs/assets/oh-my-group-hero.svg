    <path d="M160 111c0 54 34 66 78 66h246" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <g fill="#091421" stroke="#60a5fa" stroke-width="4"><circle cx="266" cy="177" r="10"/><circle cx="338" cy="177" r="10"/><circle cx="410" cy="177" r="10"/></g>
    <rect x="486" y="158" width="86" height="38" rx="14" fill="#132b4b"/>
    <text x="529" y="184" text-anchor="middle" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">feature</text>

    <path d="M232 111c0 98 45 128 112 128h140" fill="none" stroke="#a78bfa" stroke-width="4"/>
    <g fill="#091421" stroke="#a78bfa" stroke-width="4"><circle cx="378" cy="239" r="10"/><circle cx="450" cy="239" r="10"/></g>
