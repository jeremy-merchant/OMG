<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Oh My Group — Git-native coordination for coding agents</title>
  <desc id="desc">A dark technical illustration showing Git branches, coding agents, messages, and a human approval gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.52" stop-color="#071322"/>
      <stop offset="1" stop-color="#09101d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#314158" opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="28" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1598" height="898" rx="27" fill="none" stroke="#1e293b" stroke-width="2"/>

  <g transform="translate(76 104)">
    <rect x="0" y="0" width="164" height="164" rx="38" fill="#0b1725" stroke="#334155" stroke-width="2"/>
    <path d="M36 38h-18v88h18M128 38h18v88h-18" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <rect x="48" y="31" width="68" height="98" rx="18" fill="#06121f" stroke="#5eead4" stroke-width="7" filter="url(#soft)"/>
    <path d="M66 68l17 15-17 15M89 99h16" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="280" y="170" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="5">OPEN-SOURCE COORDINATION LAYER</text>
  <text x="280" y="276" fill="url(#brand)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="112" font-weight="850" letter-spacing="-4">Oh My Group</text>
  <text x="286" y="333" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="650">The <tspan fill="#5eead4">OMG CLI</tspan> for Git-native agent coordination.</text>
  <line x1="286" y1="376" x2="448" y2="376" stroke="url(#mint)" stroke-width="5" stroke-linecap="round"/>
  <text x="286" y="430" fill="#aab7ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">Source-of-truth workflows, durable messages, safe approvals,</text>
  <text x="286" y="470" fill="#aab7ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">and lightweight multi-agent coordination — entirely local.</text>

