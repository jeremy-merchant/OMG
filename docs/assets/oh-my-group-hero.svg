      <rect x="47" y="52" width="34" height="29" rx="8" fill="#5eead4"/><circle cx="56" cy="65" r="3" fill="#06121f"/><circle cx="72" cy="65" r="3" fill="#06121f"/><path d="M56 74h16" stroke="#06121f" stroke-width="3" stroke-linecap="round"/>
      <text x="113" y="61" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Agent</text>
      <text x="113" y="90" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Coder</text>
      <circle cx="113" cy="121" r="5" fill="#5eead4"/><text x="126" y="127" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Online</text>
    </g>

    <g transform="translate(592 24)">
      <rect width="248" height="174" rx="24" fill="#0a1724" stroke="#5b4680" stroke-width="2"/>
      <circle cx="64" cy="67" r="34" fill="#211634" stroke="#a78bfa" stroke-width="3"/>
      <rect x="47" y="52" width="34" height="29" rx="8" fill="#a78bfa"/><circle cx="56" cy="65" r="3" fill="#06121f"/><circle cx="72" cy="65" r="3" fill="#06121f"/><path d="M56 74h16" stroke="#06121f" stroke-width="3" stroke-linecap="round"/>
      <text x="113" y="61" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Agent</text>
      <text x="113" y="90" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Reviewer</text>
      <circle cx="113" cy="121" r="5" fill="#5eead4"/><text x="126" y="127" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Online</text>
    </g>

    <g fill="#122031" stroke="#334155" stroke-width="2">
      <rect x="276" y="82" width="64" height="46" rx="16"/><rect x="548" y="82" width="64" height="46" rx="16"/>
    </g>
    <g fill="#94a3b8"><circle cx="294" cy="105" r="4"/><circle cx="308" cy="105" r="4"/><circle cx="322" cy="105" r="4"/><circle cx="566" cy="105" r="4"/><circle cx="580" cy="105" r="4"/><circle cx="594" cy="105" r="4"/></g>
  </g>

  <g transform="translate(82 640)">
    <rect width="640" height="172" rx="26" fill="#071421" stroke="#26364b" stroke-width="2"/>
    <g transform="translate(28 30)">
      <circle cx="38" cy="38" r="36" fill="#0c1b2b" stroke="#334155" stroke-width="2"/>
      <path d="M27 32v28m0-18l19-10m-19 20l19 10" stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="27" cy="32" r="5" fill="#60a5fa"/><circle cx="46" cy="32" r="5" fill="#60a5fa"/><circle cx="46" cy="62" r="5" fill="#60a5fa"/>
      <text x="94" y="34" fill="#60a5fa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="750">Git-native</text>
      <text x="94" y="66" fill="#aab7ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Branches, diffs, refs and history</text>
      <text x="94" y="90" fill="#aab7ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">remain the source of truth.</text>
    </g>
    <line x1="322" y1="30" x2="322" y2="142" stroke="#243447"/>
    <g transform="translate(350 30)">
      <circle cx="38" cy="38" r="36" fill="#0c1b2b" stroke="#334155" stroke-width="2"/>
      <path d="M38 16l22 9v18c0 17-11 28-22 34-11-6-22-17-22-34V25z" fill="none" stroke="#5eead4" stroke-width="4"/><path d="M28 42l8 8 14-17" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="94" y="34" fill="#5eead4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="750">Safe approvals</text>
      <text x="94" y="66" fill="#aab7ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Messages and model output never</text>
      <text x="94" y="90" fill="#aab7ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">become human authority.</text>
    </g>
  </g>

  <g transform="translate(872 674)">
