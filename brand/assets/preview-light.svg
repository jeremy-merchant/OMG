<?xml version="1.0" encoding="UTF-8"?>
<svg width="1120" height="640" viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg">

  <rect width="1120" height="640" fill="#ffffff" />
  
  <g transform="translate(168, 260) scale(7)">
    
  <g transform="translate(0, 0)">
    
  <!-- Outer O -->
  <circle cx="12" cy="12" r="11" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <!-- M-like Branch Pair -->
  <path d="M 6 18 L 6 12 L 12 18 L 18 12 L 18 18" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Returning G-like Handoff -->
  <path d="M 18 12 A 7 7 0 1 0 16 19 V 15 H 13" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Human Root (Diamond) -->
  <polygon points="12,16 14,18 12,20 10,18" fill="#0f172a" />
  <!-- Agent Nodes (Circles) -->
  <circle cx="6" cy="12" r="1.5" fill="#0f172a" />
  <circle cx="18" cy="12" r="1.5" fill="#0f172a" />

  </g>
  <g transform="translate(32, 0)">
    
  <!-- O -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="#0f172a" stroke-width="3" />
  <!-- M -->
  <path d="M 28 20 L 28 4 L 36 12 L 44 4 L 44 20" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
  <!-- G -->
  <path d="M 68 8 A 8 8 0 1 0 68 16 H 60" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  </g>

  </g>
  
  <text x="560" y="488" dominant-baseline="middle" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="300" letter-spacing="1">
    A local coordination ledger for every coding agent.
  </text>
  
  <!-- OPEN SOURCE Strip -->
  <g transform="translate(1120, 0)">
    <polygon points="0,0 -200,0 0,200" fill="#991b1b" />
    <text x="-70" y="70" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" transform="rotate(45 -70 70)">OPEN SOURCE</text>
  </g>

</svg>