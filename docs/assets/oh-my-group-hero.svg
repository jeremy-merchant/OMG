    <rect x="0" y="0" width="604" height="278" rx="26" fill="#091421" stroke="#334155" stroke-width="2"/>
    <text x="34" y="48" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Repository</text>
    <path d="M38 29v24m0-18l17 8m-17 2l17 9" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="29" r="4" fill="#cbd5e1"/><circle cx="55" cy="43" r="4" fill="#cbd5e1"/><circle cx="55" cy="54" r="4" fill="#cbd5e1"/>

    <rect x="38" y="82" width="76" height="38" rx="14" fill="#172033"/>
    <text x="76" y="108" text-anchor="middle" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">main</text>
