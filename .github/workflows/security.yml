name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOFLAGS: -buildvcs=false

jobs:
  dependency-and-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify locked modules
        run: go mod verify
      - name: Vet all packages
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Run security and privacy regression suites
        run: |
          go test -count=1 ./internal/domain/...
          go test -count=1 ./internal/store/sqlite ./internal/integration/instructions
          go test -count=1 ./internal/runtime/... ./internal/transport/...
          go test -count=1 ./internal/view ./internal/app/query
      - name: Confirm unpublished release state
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=security-ci" -o ./omg ./cmd/omg
          test "$(./omg release status --json | jq -r .data.status)" = "NOT PUBLISHED"
