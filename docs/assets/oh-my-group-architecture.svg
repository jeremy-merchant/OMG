      <circle cx="76" cy="78" r="32" fill="#211634" stroke="#a78bfa" stroke-width="3"/><circle cx="67" cy="73" r="8" fill="#a78bfa"/><circle cx="88" cy="73" r="8" fill="#a78bfa"/><path d="M52 100c4-14 13-20 25-20s21 6 25 20" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
      <text x="126" y="92" fill="#a78bfa" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="800">Agents</text>
      <text x="40" y="152" fill="#cbd5e1" font-family="Inter,system-ui,sans-serif" font-size="23">Coders, reviewers, workers</text>
      <line x1="40" y1="178" x2="290" y2="178" stroke="#5b4680"/>
      <g font-family="Inter,system-ui,sans-serif">
        <g transform="translate(36 206)"><rect width="258" height="58" rx="15" fill="#0b1725" stroke="#334155"/><circle cx="32" cy="29" r="15" fill="#5eead4"/><text x="60" y="27" fill="#e2e8f0" font-size="19" font-weight="700">Agent Coder</text><circle cx="61" cy="42" r="4" fill="#5eead4"/><text x="73" y="47" fill="#94a3b8" font-size="13">available</text></g>
        <g transform="translate(36 280)"><rect width="258" height="58" rx="15" fill="#0b1725" stroke="#334155"/><circle cx="32" cy="29" r="15" fill="#60a5fa"/><text x="60" y="27" fill="#e2e8f0" font-size="19" font-weight="700">Agent Reviewer</text><circle cx="61" cy="42" r="4" fill="#60a5fa"/><text x="73" y="47" fill="#94a3b8" font-size="13">available</text></g>
        <g transform="translate(36 354)"><rect width="258" height="58" rx="15" fill="#0b1725" stroke="#334155"/><circle cx="32" cy="29" r="15" fill="#a78bfa"/><text x="60" y="27" fill="#e2e8f0" font-size="19" font-weight="700">Agent Planner</text><circle cx="61" cy="42" r="4" fill="#a78bfa"/><text x="73" y="47" fill="#94a3b8" font-size="13">available</text></g>
      </g>
    </g>

    <g transform="translate(1170)">
      <rect width="330" height="430" rx="28" fill="#081a1d" stroke="#457a78" stroke-width="2"/>
      <path d="M74 45l35 15v29c0 28-18 45-35 55-17-10-35-27-35-55V60z" fill="none" stroke="#5eead4" stroke-width="5"/><path d="M56 86l13 13 24-29" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="128" y="92" fill="#5eead4" font-family="Inter,system-ui,sans-serif" font-size="37" font-weight="800">Execution</text>
      <text x="40" y="152" fill="#cbd5e1" font-family="Inter,system-ui,sans-serif" font-size="23">Safe operations</text>
      <line x1="40" y1="178" x2="290" y2="178" stroke="#2b645f"/>
      <g fill="#e2e8f0" font-family="Inter,system-ui,sans-serif" font-size="24">
        <circle cx="54" cy="229" r="6" fill="#5eead4"/><text x="78" y="238">preflight</text>
        <circle cx="54" cy="283" r="6" fill="#5eead4"/><text x="78" y="292">review</text>
        <circle cx="54" cy="337" r="6" fill="#5eead4"/><text x="78" y="346">migrate</text>
        <circle cx="54" cy="391" r="6" fill="#5eead4"/><text x="78" y="400">verify</text>
      </g>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M342 214h36l-14-14m14 14l-14 14" stroke="#60a5fa" stroke-width="6"/>
      <path d="M732 214h36l-14-14m14 14l-14 14" stroke="#5eead4" stroke-width="6"/>
      <path d="M1122 214h36l-14-14m14 14l-14 14" stroke="#a78bfa" stroke-width="6"/>
    </g>
    <g font-family="Inter,system-ui,sans-serif" font-size="15" text-anchor="middle">
      <text x="360" y="178" fill="#93c5fd">read / observe</text><text x="750" y="178" fill="#5eead4">assign / coordinate</text><text x="1140" y="178" fill="#c4b5fd">execute / report</text>
    </g>
  </g>

  <path d="M1386 688v62H214v-62" fill="none" stroke="#54708e" stroke-width="3" stroke-dasharray="8 10"/>
  <path d="M201 699l13-14 13 14" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="745" text-anchor="middle" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="19">observe outcomes · preserve evidence · feed the next decision</text>
  <rect x="382" y="780" width="836" height="54" rx="20" fill="#0a1724" stroke="#26364b"/>
  <text x="800" y="815" text-anchor="middle" fill="#dbe4f0" font-family="Inter,system-ui,sans-serif" font-size="23">Git stores the code. <tspan fill="#5eead4" font-weight="800">Oh My Group coordinates the work.</tspan></text>
