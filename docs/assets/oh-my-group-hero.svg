    <path d="M444-60v70M172-38v48M702-38v48" stroke="#49647e" stroke-width="3" stroke-dasharray="6 8"/>
    <circle cx="444" cy="-4" r="7" fill="#5eead4"/><circle cx="172" cy="2" r="7" fill="#60a5fa"/><circle cx="702" cy="2" r="7" fill="#a78bfa"/>

